<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notes App{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f1ff;
            color: #2d2140;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: #4b2e83;
            color: white;
        }
        .logo, nav a {
            color: white;
            text-decoration: none;
        }
        .logo { font-size: 24px; font-weight: bold; }
        nav a { margin-left: 18px; }
        .container {
            width: 84%;
            max-width: 1000px;
            margin: 40px auto;
        }
        .hero, .card, .note {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(75, 46, 131, 0.12);
        }
        .hero { text-align: center; }
        h1 { color: #4b2e83; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #6d45b8;
            color: white;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn.secondary { background: #8f79c7; }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }
        .alert {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: #eee;
        }
        .alert.success { background: #d9f7df; }
        .alert.danger { background: #ffd9d9; }
        .alert.warning { background: #fff3cd; }
        .alert.info { background: #d9ecff; }
        .notes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }
        .note { margin-bottom: 10px; }
        .note h3 { margin-top: 0; color: #4b2e83; }
    </style>
</head>
<body>
<header class="header">
    <a class="logo" href="{{ url_for('index') }}">Notes App</a>
    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        {% if session.get('user_id') %}
            <a href="{{ url_for('dashboard') }}">Кабинет</a>
            <a href="{{ url_for('logout') }}">Выйти</a>
        {% else %}
            <a href="{{ url_for('register') }}">Регистрация</a>
            <a href="{{ url_for('login') }}">Вход</a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
